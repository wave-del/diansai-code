[project]
name = "ec-26-e"
version = "0.1.0"
description = ""
authors = [
    {name = "wcy",email = "wcy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.84",
    "pyserial>=3.5,<4.0",
    "gpiod>=1.5,<2.0",
    "python-periphery>=2.4,<3.0",
    "scipy>=1.13.0,<2.0.0",
    "shapely>=2.0.0,<3.0.0",
    "typer>=0.12.0",
]

[project.scripts]
ec-26-e = "ec_26_e.command.app:app"

[tool.poetry]
packages = [{include = "ec_26_e", from = "src"}]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
